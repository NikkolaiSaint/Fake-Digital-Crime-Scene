<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital Crime Scene</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div>
            <h1>DIGITAL CRIME SCENE</h1>
            <p>FORENSIC INVESTIGATION SYSTEM</p>
        </div>

        <div class="case-info">
            CASE #2047
        </div>
    </header>

    <main>

        <aside>

            <h2>EVIDENCE</h2>

            <button>📁 Documents</button>
            <button>📥 Downloads</button>
            <button>🌐 Browser History</button>
            <button>💾 System Logs</button>
            <button>🔌 USB Devices</button>

        </aside>

        <section>

            <div class="section-header">
                <h2>Evidence Viewer</h2>
                <span>STATUS: ACTIVE</span>
            </div>

            <div id="viewer">

                <h3>Welcome, Investigator.</h3>

                <p>
                    Select an evidence category from the left
                    to begin your investigation.
                </p>

            </div>

        </section>

    </main>

    <script src="app.js"></script>

</body>

</html>
